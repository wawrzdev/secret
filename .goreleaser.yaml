version: 2

project_name: secret

before:
  hooks:
    - go test ./...

builds:
  - id: secret
    main: .
    binary: secret
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - ids: [secret]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - completions/*

nfpms:
  - id: packages
    ids: [secret]
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    package_name: secret
    vendor: wawrzdev
    homepage: https://github.com/wawrzdev/secret
    maintainer: Kris Wawrzyniak <wawrz.dev@gmail.com>
    description: Generate and store private machine-local credentials
    license: MIT
    formats:
      - deb
      - archlinux
    archlinux:
      packager: Kris Wawrzyniak <wawrz.dev@gmail.com>
    bindir: /usr/bin
    contents:
      - src: completions/_secret
        dst: /usr/share/zsh/site-functions/_secret
      - src: completions/secret.bash
        dst: /usr/share/bash-completion/completions/secret
      - src: completions/secret.fish
        dst: /usr/share/fish/vendor_completions.d/secret.fish

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  # Upload and verify all nine assets before the workflow publishes the immutable release.
  draft: true
  target_commitish: "{{ .Commit }}"
  github:
    owner: wawrzdev
    name: secret
