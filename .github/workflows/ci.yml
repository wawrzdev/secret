name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hosted:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git go
      - uses: actions/checkout@v7
      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
